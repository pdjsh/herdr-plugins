[package]
name = "daybook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A morning read of what moved and what is still open, across every repo and agent"

[[bin]]
name = "daybook"
path = "src/main.rs"

[dependencies]
