[workspace]
resolver = "3"
members = [
    "crates/herdr-api",
    "plugins/agent-map",
    "plugins/workspace-order",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://codeberg.org/pdjsh/herdr-plugins"

[workspace.dependencies]
herdr-api = { path = "crates/herdr-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

[profile.release]
# Plugin panes are spawned per invocation, so binary size and startup cost matter
# more than raw throughput here.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
